[tool.importlinter]
root_package = "src"

# RNF-56 — routers não devem importar clientes externos/infraestrutura
# DIRETAMENTE: MCP, Ollama, Telegram, e-mail, Celery. Estes módulos NUNCA
# têm uma razão legítima para ser importados por um router — nem a classe
# nem uma `Depends` factory vivem neles voltados a uso direto por router
# (as factories reais, quando existem, vivem em `alert_service.py`/
# `maintenance_suggestion_service.py`, que os routers importam em vez
# disso). `src.core.ws_manager`/`src.services.model_service`/
# `src.services.model_registry` NÃO entram aqui de propósito: são o lar
# canônico de suas próprias `Depends` factories (`get_ws_manager`,
# `get_model_service`, `get_model_registry`), o mesmo padrão já usado em
# todo o projeto — o router importa a FACTORY de onde ela mora, só nunca
# instancia a classe concreta ele mesmo nem usa a classe como tipo do
# parâmetro (isso é o que os Protocols em `services/protocols.py` resolvem).
#
# `allow_indirect_imports = true` porque o próprio propósito da camada de
# Protocol/Depends é interpor uma abstração entre o router e essas
# classes — um caminho INDIRETO router -> protocols ->
# maintenance_suggestion_service -> mcp_client é exatamente o desenho
# pretendido, não uma violação; o que este contrato proíbe é o router
# importar o cliente concreto ele mesmo, diretamente.
[[tool.importlinter.contracts]]
name = "Routers não importam infraestrutura diretamente (RNF-56)"
type = "forbidden"
source_modules = ["src.routers"]
forbidden_modules = [
    "src.services.mcp_client",
    "src.services.ollama_client",
    "src.services.telegram_notification_adapter",
    "src.services.email_notification_adapter",
    "src.core.celery_app",
    "src.tasks",
]
allow_indirect_imports = true

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
# RNF-57/RNF-65 — falha o comando (e o CI) se a cobertura total cair
# abaixo de 85%. `show_missing` para o relatório continuar apontando
# linhas específicas sem cobertura (mesmo formato já usado durante esta
# task). Elevado de 80% para 85% após a suíte real adicionada em
# RNF-64/RNF-65 (ver RELATORIO-RNF-64-RNF-65.md) levar a cobertura total
# medida para ~92% — o valor não foi escolhido "porque a suíte já passa
# nele": 85% é o piso exigido pela RNF-65, e a suíte foi construída para
# cobrir comportamento real (branches de negócio, não apenas linhas),
# não para acertar um número.
fail_under = 85
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# RNF-64 — mutation testing. Fixado em mutmut==2.5.1 (ver comentário em
# requirements-dev.txt) — a série 3.x quebra de forma reprodutível neste
# projeto porque seu mecanismo de "trampoline" rejeita qualquer função
# cujo `__module__` comece com "src." (assert hardcoded em
# mutmut/stats.py), e este projeto usa "src" como o nome real do pacote
# top-level em todo import. mutmut 2.5.1 usa a arquitetura clássica
# (mutação de AST + reexecução do `runner` configurado) e não tem essa
# checagem — confirmado funcionando neste projeto.
#
# `paths_to_mutate` restringe QUAIS arquivos de fato recebem mutantes ao
# escopo "core" desta task — regra/negócio, inferência ML, processamento
# de sensores, alertas e sugestão de manutenção, exatamente as 5
# categorias pedidas na RNF-64/RNF-65:
#
#   - Domínio/regras:      model_service (resolução de threshold/model
#                           card), drift_monitor (cálculo de PSI e
#                           decisão de drift), preprocessing (feature
#                           engineering — mesmas regras usadas no
#                           treino)
#   - ML/Inferência:        inference_pipeline, model_registry, e os 4
#                           adapters ONNX/sklearn (tree, sequence,
#                           autoencoder, mlp) — extração de
#                           probabilidade, threshold de classificação
#   - Processamento de
#     sensores:              feature_buffer (buffer stateful de janela/
#                           warmup), simulator (geração NORMAL/
#                           DEGRADATION/FAILURE), sensor_stream_service
#   - Alertas:              alert_service, alert_settings_service,
#                           telegram_alert_rate_limiter,
#                           critical_failure_notification_service
#   - Manutenção/sugestão:  maintenance_suggestion_service
#   - Persistência com
#     lógica própria:        prediction_service (paginação/offset, não é
#                           um CRUD "thin")
#
# Ficam FORA do escopo, com justificativa (nunca para esconder mutante
# sobrevivente — decisão tomada ANTES de qualquer execução do mutmut):
#   - `src/routers/*`, `src/tasks/*`, `src/models/*` (ORM), `src/schemas/*`
#     (DTOs sem validador custom) — são "apenas I/O", pela própria regra
#     de Clean Architecture do projeto (CLAUDE.md §3) e pelo contrato do
#     import-linter (RNF-56): não deveriam conter regra de negócio: se um
#     mutante aqui sobrevivesse, o achado real seria "regra de negócio
#     vazou pro router", não "teste fraco".
#   - `src/services/ollama_client.py`, `email_notification_adapter.py`,
#     `telegram_notification_adapter.py`, `mcp_client.py`,
#     `notification_test_service.py`, `health_service.py` — adapters de
#     I/O puro (chamada HTTP + tradução de status code em exceção
#     tipada); a DECISÃO de negócio que os aciona (quando alertar, qual
#     severidade, quando buscar sugestão de reparo) mora em
#     alert_service/critical_failure_notification_service/
#     maintenance_suggestion_service, que ESTÃO no escopo. Já têm 100% de
#     cobertura de linha (suites dedicadas desta task), só não entram na
#     mutação porque testar "o objeto certo foi passado pro httpx" não é
#     uma regra de negócio do domínio preditivo.
#   - `src/services/protocols.py` — interfaces `Protocol` puras (só
#     assinatura, corpo `...`); não existe comportamento pra mutar.
#   - `src/core/*`, `src/main.py` — infraestrutura (config, DB, Celery
#     app, WS manager, rate limit, auth, log sanitizer, lifespan): já
#     endereçada nas RNF-62/63 (segurança) com sua própria suíte; não são
#     as "regras de negócio de manutenção preditiva" que a RNF-64 pede
#     pra validar.
#
# Linhas sem NENHUM teste passando por elas já aparecem no relatório de
# cobertura (RNF-65, rodado antes deste) como gap explícito — todo
# arquivo do escopo abaixo está com 87%+ de cobertura de linha (maioria
# 98-100%) antes mesmo do mutmut rodar, então isso não infla a contagem
# de sobreviventes de forma relevante.
#
# `runner="python -m pytest -x -q -n auto"`: `-x` para no primeiro teste que
# falhar — o suficiente pra "matar" o mutante, e mais rápido pra maioria
# dos casos (mutante morto cedo não precisa rodar o resto da suíte).
# Baseline (sem nenhuma mutação) precisa passar 100% limpo para o mutmut
# aceitar rodar — motivo pelo qual a correção do teste-bomba-relógio em
# `test_drift_monitor.py::test_task_runs_directly_without_http` (ver
# comentário no próprio teste) era um bloqueador real para a RNF-64, não
# só um nice-to-have de qualidade.
#
# `-n auto` (RNF-68/69): mutante SOBREVIVENTE não tem "primeiro teste que
# falha" pra cortar em `-x` — roda a suíte inteira (708 testes) até o fim.
# Medido no GitHub Actions real: isso é o gargalo dominante do pipeline
# (grupos de mutation testing de 12 a 68 minutos cada, contra a meta de
# <15min do pipeline inteiro). `-n auto` paraleliza a suíte nos núcleos do
# runner sem mudar nenhum teste nem a nota de mutação — só o tempo de
# parede de cada reexecução (medido localmente: ~77s serial → ~30-35s com
# workers, 707 passed + 1 xfailed idênticos e determinísticos em 3
# execuções seguidas).
[tool.mutmut]
paths_to_mutate = "src/services/alert_service.py:src/services/alert_settings_service.py:src/services/critical_failure_notification_service.py:src/services/drift_monitor.py:src/services/feature_buffer.py:src/services/inference_pipeline.py:src/services/maintenance_suggestion_service.py:src/services/mlp_adapter.py:src/services/model_registry.py:src/services/model_service.py:src/services/onnx_autoencoder_adapter.py:src/services/onnx_sequence_adapter.py:src/services/onnx_tree_adapter.py:src/services/prediction_service.py:src/services/preprocessing.py:src/services/sensor_stream_service.py:src/services/simulator.py:src/services/telegram_alert_rate_limiter.py"
backup = false
runner = "python -m pytest -x -q -n auto"
tests_dir = "tests/"
