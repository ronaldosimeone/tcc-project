stages:
  # ── Ingestão (RF-01) ────────────────────────────────────────────────────
  # download/extração do ZIP oficial (auditado: apenas se ausente) → CSV →
  # rotulagem de anomalias (intervalos de falha reais) → Parquet.
  # `data/raw/metropt-3+dataset.zip` (~208 MB) é o único binário GRANDE que
  # não era versionado por nada (nem Git, nem DVC) antes desta task — por
  # isso é o único `dep` real gerenciado pelo DVC neste stage (RNF-61).
  # O CSV extraído fica em disco mas não entra como dep/out formal: é
  # regenerado deterministicamente do zip por `extract_csv()` sempre que
  # ausente, e não faz sentido guardar duas cópias quase idênticas dos
  # mesmos ~430 MB no remote.
  ingest:
    cmd: python -m src.ingest_metropt
    deps:
      - src/ingest_metropt.py
      - data/raw/metropt-3+dataset.zip
    outs:
      # metropt3.parquet (~28 MB) já é commitado DIRETAMENTE no Git desde a
      # RNF-56/57 desta mesma sessão — a suíte de testes do backend
      # (SensorSimulator/SensorStreamService/DriftMonitor) depende dele
      # existir num checkout limpo de CI, sem precisar de `dvc pull`.
      # `cache: false` mantém esse contrato: o DVC rastreia que este
      # arquivo É a saída do stage `ingest` (para o grafo de dependências
      # e detecção de staleness), mas NÃO move o arquivo para o cache/
      # remote DVC nem o re-gitignora — continua um arquivo Git normal.
      - data/processed/metropt3.parquet:
          cache: false

  # ── Treino de produção — os 7 modelos servidos (geração ``*_v3``) ───────
  # Protocolo aninhado sem vazamento (src/nested_protocol.py): hiperparâmetros
  # por leave-one-failure-out sobre as falhas de treino (custo RN-02),
  # calibração Platt nas predições OOF, limiar RN-02 na escala calibrada,
  # refit em todos os dados, export ONNX com checagem de paridade. Sem SMOTE;
  # desbalanceamento tratado por peso de classe + subamostragem de negativos.
  # A geração anterior (split aleatório + SMOTE) foi arquivada em
  # models/legacy e não é servida. Treina na GPU (apps/ml/.venv-gpu).
  train_production:
    cmd: python -m src.train_production
    deps:
      - src/train_production.py
      - src/nested_protocol.py
      - src/deep_temporal.py
      - src/evaluate_nested.py
      - src/preprocessing.py
      - data/processed/metropt3.parquet
      - data/processed/metropt2022.parquet
    outs:
      # Artefatos commitados direto no Git (o backend os consome via
      # bind-mount) — mesmo contrato ``cache: false`` do stage ``ingest``.
      - models/random_forest_v3.onnx:
          cache: false
      - models/xgboost_v3.onnx:
          cache: false
      - models/mlp_v3.onnx:
          cache: false
      - models/mlp_v3_scaler.joblib:
          cache: false
      - models/tcn_v3.onnx:
          cache: false
      - models/tcn_v3_scaler.joblib:
          cache: false
      - models/bilstm_v3.onnx:
          cache: false
      - models/bilstm_v3_scaler.joblib:
          cache: false
      - models/patchtst_v3.onnx:
          cache: false
      - models/patchtst_v3_scaler.joblib:
          cache: false
      - models/autoencoder_v3.onnx:
          cache: false
      - models/autoencoder_v3_scaler.joblib:
          cache: false
    metrics:
      - models/random_forest_v3_card.json:
          cache: false
      - models/xgboost_v3_card.json:
          cache: false
      - models/mlp_v3_card.json:
          cache: false
      - models/tcn_v3_card.json:
          cache: false
      - models/bilstm_v3_card.json:
          cache: false
      - models/patchtst_v3_card.json:
          cache: false
      - models/autoencoder_v3_card.json:
          cache: false
