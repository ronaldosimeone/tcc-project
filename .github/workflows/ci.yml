name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # 1. Job de Verificação de Variáveis de Ambiente
  env-check:
    name: Check Environment Variables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify .env.example exists
        run: |
          if [ ! -f .env.example ]; then
            echo "Error: .env.example file is missing!"
            exit 1
          fi
          echo ".env.example found."

  # 1b. Auditoria de segurança de dependências (RNF-62)
  #
  # Política (ver README "Segurança"):
  #  • Backend / Frontend / mcp-server: o CI FALHA se aparecer QUALQUER
  #    vulnerabilidade High/Critical nas dependências de PRODUÇÃO. Nenhum
  #    `--ignore-vuln`/`continue-on-error`/filtro de severidade nos 3 audits
  #    de produção abaixo — qualquer achado quebra o build de verdade.
  #
  #  • `evidently` (RF-27/RNF-55, monitoramento de data drift) foi REMOVIDO
  #    de apps/backend/requirements.txt nesta task: carregava `nltk`
  #    (dependência obrigatória e imediata — o próprio `evidently/__init__.py`
  #    importa um módulo que faz `from nltk.corpus import words`) com uma
  #    vulnerabilidade High sem correção publicada em nenhuma versão
  #    (PYSEC-2026-3740/CVE-2026-81726). O cálculo de PSI usado pelo
  #    drift monitor foi reimplementado com numpy/pandas (já dependências
  #    existentes) — ver `drift_monitor.py::_population_stability_index` e
  #    README §4.15 "PSI sem evidently (RNF-62)" para a prova de
  #    equivalência bit-a-bit com o `evidently` real.
  security-audit:
    name: Dependency Security Audit (RNF-62)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: pip-audit — backend (produção)
        run: pip-audit -r apps/backend/requirements.txt

      # mcp-server: `requirements.txt` inteiro é produção (serviço interno).
      # chromadb foi removido (CVE-2026-45829/45830/45831/45833 sem correção
      # em nenhuma versão) e substituído por vector_store.py; transformers
      # subiu para 5.x (cascata sentence-transformers/tokenizers/torch).
      - name: pip-audit — mcp-server (produção)
        run: pip-audit -r apps/mcp-server/requirements.txt

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install frontend deps
        run: cd apps/frontend && pnpm install --frozen-lockfile

      # --prod: ignora devDependencies (jsdom/storybook/vitest/eslint/shadcn
      # — shadcn é CLI, foi movido p/ devDependencies nesta task pois nada
      # em app/ o importa). --audit-level high: só High/Critical quebram.
      - name: pnpm audit — frontend (produção, High/Critical)
        run: cd apps/frontend && pnpm audit --prod --audit-level high

  # 2. Lint Python (Ruff, Black, Mypy)
  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip" # Ativa o cache do pip para acelerar

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy
          # Instala as dependências do backend para o mypy não reclamar de imports
          # (+ requirements-dev.txt — RNF-62 tirou o pytest do requirements.txt,
          # e os arquivos em tests/ importam pytest)
          if [ -f apps/backend/requirements.txt ]; then pip install -r apps/backend/requirements.txt; fi
          if [ -f apps/backend/requirements-dev.txt ]; then pip install -r apps/backend/requirements-dev.txt; fi
          if [ -f apps/ml/requirements.txt ]; then pip install -r apps/ml/requirements.txt; fi

      - name: Run Ruff (Linting)
        run: ruff check apps/backend apps/ml

      - name: Run Black (Formatting Check)
        run: black --check apps/backend apps/ml

      - name: Run Mypy (Type Checking)
        run: mypy apps/backend apps/ml --ignore-missing-imports

  # 3. Testes Python (Pytest)
  test-python:
    name: Test Python (Backend & ML)
    runs-on: ubuntu-latest
    needs: lint-python # Só roda se o lint passar
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip import-linter
          if [ -f apps/backend/requirements.txt ]; then pip install -r apps/backend/requirements.txt; fi
          # RNF-62 — pytest / pytest-asyncio / pytest-cov saíram do
          # requirements.txt de produção; vêm daqui.
          if [ -f apps/backend/requirements-dev.txt ]; then pip install -r apps/backend/requirements-dev.txt; fi
          if [ -f apps/ml/requirements.txt ]; then pip install -r apps/ml/requirements.txt; fi

      # RNF-56/57 — o step geral de pytest estava desabilitado há tempos
      # (comentário antigo dizia que exigiria provisionar Postgres no
      # runner). Auditoria desta task: NENHUM teste do backend usa Postgres
      # real — todos os que tocam banco usam SQLite em memória
      # (`sqlite+aiosqlite:///:memory:`, ver qualquer `tests/test_*.py`) —
      # a causa raiz real era outra (um singleton em
      # `sensor_stream_service.py` construía o `SensorSimulator` — e
      # carregava o parquet MetroPT-3 inteiro — no IMPORT do módulo,
      # quebrando a coleta de QUALQUER teste que importasse `src.main`
      # sem o parquet disponível; corrigido para lazy, mesmo padrão já
      # documentado em `services/simulator.py::get_simulator()`).
      #
      # RNF-64/RNF-65 — o `--ignore=tests/test_simulator.py` que existia
      # aqui foi REMOVIDO nesta task: era um contorno para um
      # `IndexError: 3` de coleta pré-existente e não relacionado (anterior
      # à RF-22, já corrigido pela mudança acima) que nunca foi revertido
      # depois do fix. Auditoria confirmou: `test_simulator.py` tinha
      # ADICIONALMENTE um bug próprio de path (`Path(__file__).parents[3]`
      # apontava pra raiz do repo, não `apps/`) que fazia 40 dos 44 testes
      # do arquivo serem pulados silenciosamente em QUALQUER ambiente —
      # ou seja, o CI nunca executou essa suíte de verdade. Corrigido para
      # usar `settings.simulator_parquet_path` (o mesmo path canônico já
      # usado em produção e por `test_drift_monitor.py`); os 44 testes
      # agora rodam e passam aqui também.
      #
      # `--cov=src --cov-report=term-missing`: config de cobertura real em
      # `apps/backend/pyproject.toml` (`[tool.coverage.report]`,
      # `fail_under = 85` — elevado de 80% nesta task, RNF-65) — o comando
      # FALHA (exit != 0) se a cobertura total ficar abaixo do piso, sem
      # precisar de um step separado só para checar o número.
      - name: Run Pytest (Backend, com cobertura — RNF-57/RNF-65)
        run: |
          cd apps/backend
          pytest --cov=src --cov-report=term-missing -v

      # RNF-56 — garante que a fronteira routers -> infraestrutura
      # (MCP/Ollama/Telegram/e-mail/Celery, ver
      # apps/backend/pyproject.toml::[tool.importlinter]) não regride.
      - name: Run import-linter (RNF-56)
        run: |
          cd apps/backend
          lint-imports

      - name: Run Pytest (ML)
        run: |
          cd apps/ml
          # pytest # Descomente quando criar o test_ingest_metropt.py

      # RNF-60/61 — validação ESTRUTURAL do pipeline DVC (grafo bem-formado,
      # ambiente sadio). Deliberadamente NÃO roda `dvc repro`/`push`/`pull`
      # aqui: exigiria o .zip bruto (~208 MB, não versionado no Git — só o
      # ponteiro .dvc) e um MinIO/S3 real acessível pelo runner —
      # infraestrutura que o CI não tem hoje. Reprodução completa é validada
      # localmente (ver relatório da task RNF-60/61); documentado como
      # limitação conhecida, não mascarado com mocks que não validariam o
      # pipeline real. Os 3 comandos saem com código 0 mesmo sem o .zip e
      # sem credenciais (testado): `doctor` checa o ambiente, `dag` valida
      # que o dvc.yaml é um grafo bem-formado, `status` falha só se o
      # dvc.lock estiver corrompido/incoerente (a linha "deleted:
      # metropt-3+dataset.zip" que ele imprime no CI é esperada e não
      # quebra o build).
      - name: Validate DVC pipeline structure (RNF-60/61)
        run: |
          cd apps/ml
          dvc doctor
          dvc dag
          dvc status

  # 4. Mutation Testing (RNF-64) — valida que a suíte de testes do backend
  # de fato MATA mutações no código "core" (regra de negócio/inferência
  # ML/processamento de sensores/alertas/sugestão de manutenção — escopo e
  # justificativa completos em apps/backend/pyproject.toml
  # [tool.mutmut]), não só cobre linhas (isso é RNF-57/RNF-65, job acima).
  #
  # mutmut fixado em 2.5.1 (não a série 3.x): a série 3.x quebra de forma
  # reprodutível neste projeto porque seu mecanismo de "trampoline" rejeita
  # qualquer função cujo `__module__` comece com "src." (assert hardcoded
  # em mutmut/stats.py), e este projeto usa "src" como o nome real do
  # pacote top-level em todo import — ver comentário completo em
  # apps/backend/requirements-dev.txt.
  #
  # Por que matrix (4 grupos) em vez de um job único: mutation testing é
  # ORDENS DE MAGNITUDE mais lento que pytest — cada um dos ~1400 mutantes
  # do escopo core dispara sua PRÓPRIA subprocess de pytest; um job único
  # rodaria os 18 arquivos sequencialmente (~1h de parede). Dividir por
  # arquivo em grupos que rodam EM PARALELO corta o tempo proporcionalmente
  # sem tirar nenhum arquivo do escopo real: os 4 grupos juntos cobrem
  # exatamente os mesmos 18 arquivos de `[tool.mutmut] paths_to_mutate` —
  # nenhum subconjunto menor, nunca um grupo "fácil" isolado escondendo um
  # grupo maior/mais fraco (o gate abaixo agrega os 4 antes de decidir).
  mutation-testing:
    name: Mutation Testing (RNF-64) — grupo ${{ matrix.group }}
    runs-on: ubuntu-latest
    needs: lint-python
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: 1
            paths: "src/services/alert_service.py:src/services/alert_settings_service.py:src/services/critical_failure_notification_service.py:src/services/drift_monitor.py:src/services/feature_buffer.py"
          - group: 2
            paths: "src/services/inference_pipeline.py:src/services/maintenance_suggestion_service.py:src/services/mlp_adapter.py:src/services/model_registry.py"
          - group: 3
            paths: "src/services/model_service.py:src/services/onnx_autoencoder_adapter.py:src/services/onnx_sequence_adapter.py:src/services/onnx_tree_adapter.py"
          - group: 4
            paths: "src/services/prediction_service.py:src/services/preprocessing.py:src/services/sensor_stream_service.py:src/services/simulator.py:src/services/telegram_alert_rate_limiter.py"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/backend/requirements.txt
          pip install -r apps/backend/requirements-dev.txt

      # `--paths-to-mutate` sobrescreve, só para este job, o subconjunto de
      # `[tool.mutmut] paths_to_mutate` do pyproject.toml (que continua
      # sendo a fonte de verdade do escopo CORE completo, usada também na
      # execução local via `mutmut run`) — cada grupo do matrix cobre uma
      # fatia DISJUNTA dos mesmos 18 arquivos.
      #
      # `|| true`: o exit code de `mutmut run --CI` reflete se sobrou
      # mutante vivo NESTE grupo isolado — o job não deve falhar aqui; quem
      # decide pass/fail é o `mutation-score-gate` sobre o AGREGADO dos 4
      # grupos (ver comentário acima do job `mutation-testing`).
      - name: Run mutmut (grupo ${{ matrix.group }})
        working-directory: apps/backend
        run: |
          mutmut run --paths-to-mutate="${{ matrix.paths }}" --CI 2>&1 | tee /tmp/mutmut-run.log || true

      - name: Parse mutation summary
        working-directory: apps/backend
        run: |
          python scripts/parse_mutmut_summary.py /tmp/mutmut-run.log "mutmut-summary-group-${{ matrix.group }}.json"

      - name: Upload mutation summary
        uses: actions/upload-artifact@v4
        with:
          name: mutmut-summary-group-${{ matrix.group }}
          path: apps/backend/mutmut-summary-group-${{ matrix.group }}.json

  # 5. Gate do Mutation Score (RNF-64) — agrega os 4 grupos acima e FALHA
  # o build de verdade (exit != 0) se o score combinado ficar abaixo de
  # 70%. Roda separado do job de matrix pra dar um resultado único e claro
  # no PR, em vez de 4 checks parciais que ninguém interpreta sozinho.
  mutation-score-gate:
    name: Mutation Score Gate (RNF-64, piso 70%)
    runs-on: ubuntu-latest
    needs: mutation-testing
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download all mutation summaries
        uses: actions/download-artifact@v4
        with:
          pattern: mutmut-summary-group-*
          path: /tmp/summaries
          merge-multiple: true

      - name: Check aggregated mutation score (RNF-64, >= 70%)
        run: |
          python apps/backend/scripts/check_mutation_score.py 70 /tmp/summaries/*.json

  # 6. Lint TypeScript (ESLint, Prettier)
  lint-typescript:
    name: Lint TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm" # Ativa o cache do pnpm para acelerar

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: cd apps/frontend && pnpm eslint .

      - name: Run Prettier
        run: cd apps/frontend && pnpm prettier --check .

      # RNF-58: nenhum componente pode exceder 200 linhas. Checagem
      # COMPLEMENTAR à regra `complexity` do ESLint acima — um arquivo pode
      # ficar sob 200 linhas e ainda ser complexo demais, e vice-versa; o
      # ESLint não tem uma regra nativa de "max linhas por componente React"
      # confiável o bastante, daí o script dedicado.
      - name: Check component size (RNF-58, max 200 lines)
        run: cd apps/frontend && pnpm check:component-size

  # 7. Testes TypeScript (Vitest)
  test-typescript:
    name: Test TypeScript
    runs-on: ubuntu-latest
    needs: lint-typescript # Só roda se o lint passar
    steps:
      - uses: actions/checkout@v4
      
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # RNF-59: cobertura mínima de 70% (statements/branches/functions/lines)
      # — gate real via `coverage.thresholds` em vitest.config.ts (mesmo
      # padrão do `fail_under=80` do backend em pyproject.toml). O comando
      # sai com código != 0 se qualquer métrica ficar abaixo do piso, sem
      # precisar de um step de CI separado só para checar o número.
      - name: Run Vitest com cobertura (RNF-59)
        run: |
          cd apps/frontend
          pnpm exec vitest run --coverage

      # RNF-58: garante que o catálogo de componentes builda de verdade —
      # falha de build do Storybook quebra o CI, não só um "parece ok".
      - name: Build Storybook (RNF-58)
        run: |
          cd apps/frontend
          pnpm exec storybook build

  # 8. Testes E2E com Playwright + MSW (RNF-16 / RNF-17)
  test-e2e:
    name: E2E Tests (Playwright + MSW)
    runs-on: ubuntu-latest
    needs: test-typescript # Só roda após os testes unitários passarem
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: apps/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          cd apps/frontend
          pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: |
          cd apps/frontend
          pnpm exec playwright install chromium --with-deps

      - name: Generate MSW Service Worker
        # Cria public/mockServiceWorker.js que o MswProvider carrega no browser.
        # Deve rodar antes do build/dev server para que o arquivo esteja disponível.
        run: |
          cd apps/frontend
          pnpm e2e:setup

      - name: Run Playwright E2E tests
        run: |
          cd apps/frontend
          pnpm e2e
        env:
          CI: true
          # RNF-13: URL do backend — MSW intercepta esta origem no browser
          NEXT_PUBLIC_API_URL: http://localhost:8000
          # Ativa o MswProvider para os testes E2E
          NEXT_PUBLIC_MSW_ENABLED: "true"

      - name: Upload Playwright report
        if: always() # Faz upload mesmo em caso de falha para facilitar debugging
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/frontend/playwright-report/
          retention-days: 7

      - name: Upload test results (screenshots / traces)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: apps/frontend/e2e-results/
          retention-days: 7