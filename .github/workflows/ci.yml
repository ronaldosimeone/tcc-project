name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # 1. Job de Verificação de Variáveis de Ambiente
  env-check:
    name: Check Environment Variables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify .env.example exists
        run: |
          if [ ! -f .env.example ]; then
            echo "Error: .env.example file is missing!"
            exit 1
          fi
          echo ".env.example found."

  # 2. Lint Python (Ruff, Black, Mypy)
  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip" # Ativa o cache do pip para acelerar

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy
          # Instala as dependências do backend para o mypy não reclamar de imports
          if [ -f apps/backend/requirements.txt ]; then pip install -r apps/backend/requirements.txt; fi
          if [ -f apps/ml/requirements.txt ]; then pip install -r apps/ml/requirements.txt; fi

      - name: Run Ruff (Linting)
        run: ruff check apps/backend apps/ml

      - name: Run Black (Formatting Check)
        run: black --check apps/backend apps/ml

      - name: Run Mypy (Type Checking)
        run: mypy apps/backend apps/ml --ignore-missing-imports

  # 3. Testes Python (Pytest)
  test-python:
    name: Test Python (Backend & ML)
    runs-on: ubuntu-latest
    needs: lint-python # Só roda se o lint passar
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pytest httpx pytest-cov import-linter
          if [ -f apps/backend/requirements.txt ]; then pip install -r apps/backend/requirements.txt; fi
          if [ -f apps/ml/requirements.txt ]; then pip install -r apps/ml/requirements.txt; fi

      # RNF-56/57 — o step geral de pytest estava desabilitado há tempos
      # (comentário antigo dizia que exigiria provisionar Postgres no
      # runner). Auditoria desta task: NENHUM teste do backend usa Postgres
      # real — todos os que tocam banco usam SQLite em memória
      # (`sqlite+aiosqlite:///:memory:`, ver qualquer `tests/test_*.py`) —
      # a causa raiz real era outra (um singleton em
      # `sensor_stream_service.py` construía o `SensorSimulator` — e
      # carregava o parquet MetroPT-3 inteiro — no IMPORT do módulo,
      # quebrando a coleta de QUALQUER teste que importasse `src.main`
      # sem o parquet disponível; corrigido para lazy, mesmo padrão já
      # documentado em `services/simulator.py::get_simulator()`).
      # `--ignore=tests/test_simulator.py`: falha de coleta pré-existente
      # e não relacionada (`IndexError: 3`, confirmado via `git stash`
      # antes da RF-22) — mesmo contorno já usado em toda validação local.
      # Os ~34 testes que ainda dependem do parquet real
      # (`test_sse_endpoint.py`, 2 testes de `test_drift_monitor.py`) têm
      # guarda `skipif` própria e são pulados de forma limpa SE o arquivo
      # não existir — mas ele agora É commitado (ver .gitignore), então em
      # CI eles rodam normalmente também.
      #
      # `--cov=src --cov-report=term-missing`: config de cobertura real em
      # `apps/backend/pyproject.toml` (`[tool.coverage.report]`,
      # `fail_under = 80`) — o comando FALHA (exit != 0) se a cobertura
      # total ficar abaixo de 80% (RNF-57), sem precisar de um step
      # separado só para checar o número.
      - name: Run Pytest (Backend, com cobertura — RNF-57)
        run: |
          cd apps/backend
          pytest --ignore=tests/test_simulator.py --cov=src --cov-report=term-missing -v

      # RNF-56 — garante que a fronteira routers -> infraestrutura
      # (MCP/Ollama/Telegram/e-mail/Celery, ver
      # apps/backend/pyproject.toml::[tool.importlinter]) não regride.
      - name: Run import-linter (RNF-56)
        run: |
          cd apps/backend
          lint-imports

      - name: Run Pytest (ML)
        run: |
          cd apps/ml
          # pytest # Descomente quando criar o test_ingest_metropt.py

  # 4. Lint TypeScript (ESLint, Prettier)
  lint-typescript:
    name: Lint TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm" # Ativa o cache do pnpm para acelerar

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: cd apps/frontend && pnpm eslint .

      - name: Run Prettier
        run: cd apps/frontend && pnpm prettier --check .

      # RNF-58: nenhum componente pode exceder 200 linhas. Checagem
      # COMPLEMENTAR à regra `complexity` do ESLint acima — um arquivo pode
      # ficar sob 200 linhas e ainda ser complexo demais, e vice-versa; o
      # ESLint não tem uma regra nativa de "max linhas por componente React"
      # confiável o bastante, daí o script dedicado.
      - name: Check component size (RNF-58, max 200 lines)
        run: cd apps/frontend && pnpm check:component-size

  # 5. Testes TypeScript (Vitest)
  test-typescript:
    name: Test TypeScript
    runs-on: ubuntu-latest
    needs: lint-typescript # Só roda se o lint passar
    steps:
      - uses: actions/checkout@v4
      
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # RNF-59: cobertura mínima de 70% (statements/branches/functions/lines)
      # — gate real via `coverage.thresholds` em vitest.config.ts (mesmo
      # padrão do `fail_under=80` do backend em pyproject.toml). O comando
      # sai com código != 0 se qualquer métrica ficar abaixo do piso, sem
      # precisar de um step de CI separado só para checar o número.
      - name: Run Vitest com cobertura (RNF-59)
        run: |
          cd apps/frontend
          pnpm exec vitest run --coverage

      # RNF-58: garante que o catálogo de componentes builda de verdade —
      # falha de build do Storybook quebra o CI, não só um "parece ok".
      - name: Build Storybook (RNF-58)
        run: |
          cd apps/frontend
          pnpm exec storybook build

  # 6. Testes E2E com Playwright + MSW (RNF-16 / RNF-17)
  test-e2e:
    name: E2E Tests (Playwright + MSW)
    runs-on: ubuntu-latest
    needs: test-typescript # Só roda após os testes unitários passarem
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: apps/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          cd apps/frontend
          pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: |
          cd apps/frontend
          pnpm exec playwright install chromium --with-deps

      - name: Generate MSW Service Worker
        # Cria public/mockServiceWorker.js que o MswProvider carrega no browser.
        # Deve rodar antes do build/dev server para que o arquivo esteja disponível.
        run: |
          cd apps/frontend
          pnpm e2e:setup

      - name: Run Playwright E2E tests
        run: |
          cd apps/frontend
          pnpm e2e
        env:
          CI: true
          # RNF-13: URL do backend — MSW intercepta esta origem no browser
          NEXT_PUBLIC_API_URL: http://localhost:8000
          # Ativa o MswProvider para os testes E2E
          NEXT_PUBLIC_MSW_ENABLED: "true"

      - name: Upload Playwright report
        if: always() # Faz upload mesmo em caso de falha para facilitar debugging
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/frontend/playwright-report/
          retention-days: 7

      - name: Upload test results (screenshots / traces)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: apps/frontend/e2e-results/
          retention-days: 7