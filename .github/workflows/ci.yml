name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# RNF-68/69 — cancela a run anterior do mesmo PR/branch quando um novo push
# chega, em vez de deixar as duas rodarem em paralelo até o fim (achado
# real durante a validação: sem isso, cada push num PR ativo duplica o
# custo de mutation testing — 18 grupos rodando duas vezes).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Job de Verificação de Variáveis de Ambiente
  env-check:
    name: Check Environment Variables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify .env.example exists
        run: |
          if [ ! -f .env.example ]; then
            echo "Error: .env.example file is missing!"
            exit 1
          fi
          echo ".env.example found."

  # 1b. Auditoria de segurança de dependências (RNF-62)
  #
  # Política (ver README "Segurança"):
  #  • Backend / Frontend / mcp-server: o CI FALHA se aparecer QUALQUER
  #    vulnerabilidade High/Critical nas dependências de PRODUÇÃO. Nenhum
  #    `--ignore-vuln`/`continue-on-error`/filtro de severidade nos 3 audits
  #    de produção abaixo — qualquer achado quebra o build de verdade.
  #
  #  • `evidently` (RF-27/RNF-55, monitoramento de data drift) foi REMOVIDO
  #    de apps/backend/requirements.txt nesta task: carregava `nltk`
  #    (dependência obrigatória e imediata — o próprio `evidently/__init__.py`
  #    importa um módulo que faz `from nltk.corpus import words`) com uma
  #    vulnerabilidade High sem correção publicada em nenhuma versão
  #    (PYSEC-2026-3740/CVE-2026-81726). O cálculo de PSI usado pelo
  #    drift monitor foi reimplementado com numpy/pandas (já dependências
  #    existentes) — ver `drift_monitor.py::_population_stability_index` e
  #    README §4.15 "PSI sem evidently (RNF-62)" para a prova de
  #    equivalência bit-a-bit com o `evidently` real.
  security-audit:
    name: Dependency Security Audit (RNF-62)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: pip-audit — backend (produção)
        run: pip-audit -r apps/backend/requirements.txt

      # mcp-server: `requirements.txt` inteiro é produção (serviço interno).
      # chromadb foi removido (CVE-2026-45829/45830/45831/45833 sem correção
      # em nenhuma versão) e substituído por vector_store.py; transformers
      # subiu para 5.x (cascata sentence-transformers/tokenizers/torch).
      - name: pip-audit — mcp-server (produção)
        run: pip-audit -r apps/mcp-server/requirements.txt

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          # RNF-68/69 — sem isso, setup-node procura pnpm-lock.yaml na raiz
          # do repo (não existe) e falha ANTES de qualquer install rodar:
          # "Dependencies lock file is not found... Supported file
          # patterns: pnpm-lock.yaml" — achado real na 1ª execução no
          # GitHub Actions, invisível localmente (esse cache nem roda fora
          # do runner).
          cache-dependency-path: apps/frontend/pnpm-lock.yaml

      - name: Install frontend deps
        run: cd apps/frontend && pnpm install --frozen-lockfile

      # --prod: ignora devDependencies (jsdom/storybook/vitest/eslint/shadcn
      # — shadcn é CLI, foi movido p/ devDependencies nesta task pois nada
      # em app/ o importa). --audit-level high: só High/Critical quebram.
      - name: pnpm audit — frontend (produção, High/Critical)
        run: cd apps/frontend && pnpm audit --prod --audit-level high

  # 2. Lint Python (Ruff, Black, Mypy)
  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip" # Ativa o cache do pip para acelerar

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # RNF-68/69 — versões travadas, IDÊNTICAS às do .pre-commit-config.yaml.
          # Sem isso, `pip install ruff black mypy` resolve sempre a última
          # release do PyPI: como o CI nunca fixava versão, ele divergia do
          # que o pre-commit (que roda local antes do commit) valida — a causa
          # raiz real de o CI nunca ter fechado verde neste projeto (auditoria
          # RNF-68/69: `black` mais novo reformatava 8 arquivos que a versão
          # travada considera corretos).
          pip install ruff==0.4.0 black==24.3.0 mypy==1.10.0
          # Instala as dependências do backend para o mypy não reclamar de imports
          # (+ requirements-dev.txt — RNF-62 tirou o pytest do requirements.txt,
          # e os arquivos em tests/ importam pytest)
          if [ -f apps/backend/requirements.txt ]; then pip install -r apps/backend/requirements.txt; fi
          if [ -f apps/backend/requirements-dev.txt ]; then pip install -r apps/backend/requirements-dev.txt; fi
          if [ -f apps/ml/requirements.txt ]; then pip install -r apps/ml/requirements.txt; fi

      - name: Run Ruff (Linting)
        run: ruff check apps/backend apps/ml

      - name: Run Black (Formatting Check)
        run: black --check apps/backend apps/ml

      - name: Run Mypy (Type Checking)
        run: mypy apps/backend apps/ml --ignore-missing-imports

  # 3. Testes Python (Pytest)
  #
  # RNF-68 — SEM `needs: lint-python`: pytest não depende de ruff/black/mypy
  # terem passado, só das MESMAS dependências instaladas (que este job já
  # instala por conta própria). Rodar em paralelo com lint-python em vez de
  # depois corta ~1-2 min de wall-clock sem perder nenhuma validação — os
  # dois continuam bloqueantes, só deixam de ser sequenciais sem motivo real.
  test-python:
    name: Test Python (Backend & ML)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip import-linter
          if [ -f apps/backend/requirements.txt ]; then pip install -r apps/backend/requirements.txt; fi
          # RNF-62 — pytest / pytest-asyncio / pytest-cov saíram do
          # requirements.txt de produção; vêm daqui.
          if [ -f apps/backend/requirements-dev.txt ]; then pip install -r apps/backend/requirements-dev.txt; fi
          if [ -f apps/ml/requirements.txt ]; then pip install -r apps/ml/requirements.txt; fi

      # RNF-56/57 — o step geral de pytest estava desabilitado há tempos
      # (comentário antigo dizia que exigiria provisionar Postgres no
      # runner). Auditoria desta task: NENHUM teste do backend usa Postgres
      # real — todos os que tocam banco usam SQLite em memória
      # (`sqlite+aiosqlite:///:memory:`, ver qualquer `tests/test_*.py`) —
      # a causa raiz real era outra (um singleton em
      # `sensor_stream_service.py` construía o `SensorSimulator` — e
      # carregava o parquet MetroPT-3 inteiro — no IMPORT do módulo,
      # quebrando a coleta de QUALQUER teste que importasse `src.main`
      # sem o parquet disponível; corrigido para lazy, mesmo padrão já
      # documentado em `services/simulator.py::get_simulator()`).
      #
      # RNF-64/RNF-65 — o `--ignore=tests/test_simulator.py` que existia
      # aqui foi REMOVIDO nesta task: era um contorno para um
      # `IndexError: 3` de coleta pré-existente e não relacionado (anterior
      # à RF-22, já corrigido pela mudança acima) que nunca foi revertido
      # depois do fix. Auditoria confirmou: `test_simulator.py` tinha
      # ADICIONALMENTE um bug próprio de path (`Path(__file__).parents[3]`
      # apontava pra raiz do repo, não `apps/`) que fazia 40 dos 44 testes
      # do arquivo serem pulados silenciosamente em QUALQUER ambiente —
      # ou seja, o CI nunca executou essa suíte de verdade. Corrigido para
      # usar `settings.simulator_parquet_path` (o mesmo path canônico já
      # usado em produção e por `test_drift_monitor.py`); os 44 testes
      # agora rodam e passam aqui também.
      #
      # `--cov=src --cov-report=term-missing`: config de cobertura real em
      # `apps/backend/pyproject.toml` (`[tool.coverage.report]`,
      # `fail_under = 85` — elevado de 80% nesta task, RNF-65) — o comando
      # FALHA (exit != 0) se a cobertura total ficar abaixo do piso, sem
      # precisar de um step separado só para checar o número.
      - name: Run Pytest (Backend, com cobertura — RNF-57/RNF-65)
        run: |
          cd apps/backend
          pytest --cov=src --cov-report=term-missing --cov-report=html --cov-report=xml -v --junitxml=pytest-report.xml

      # RNF-69 — relatórios disponíveis mesmo se o pytest acima falhar
      # (`if: always()`): é exatamente quando o dev mais precisa investigar.
      - name: Upload pytest + coverage report (RNF-69)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python
          path: |
            apps/backend/htmlcov/
            apps/backend/coverage.xml
            apps/backend/pytest-report.xml
          retention-days: 7

      # RNF-56 — garante que a fronteira routers -> infraestrutura
      # (MCP/Ollama/Telegram/e-mail/Celery, ver
      # apps/backend/pyproject.toml::[tool.importlinter]) não regride.
      - name: Run import-linter (RNF-56)
        run: |
          cd apps/backend
          lint-imports

      - name: Run Pytest (ML)
        run: |
          cd apps/ml
          # pytest # Descomente quando criar o test_ingest_metropt.py

      # RNF-60/61 — validação ESTRUTURAL do pipeline DVC (grafo bem-formado,
      # ambiente sadio). Deliberadamente NÃO roda `dvc repro`/`push`/`pull`
      # aqui: exigiria o .zip bruto (~208 MB, não versionado no Git — só o
      # ponteiro .dvc) e um MinIO/S3 real acessível pelo runner —
      # infraestrutura que o CI não tem hoje. Reprodução completa é validada
      # localmente (ver relatório da task RNF-60/61); documentado como
      # limitação conhecida, não mascarado com mocks que não validariam o
      # pipeline real. Os 3 comandos saem com código 0 mesmo sem o .zip e
      # sem credenciais (testado): `doctor` checa o ambiente, `dag` valida
      # que o dvc.yaml é um grafo bem-formado, `status` falha só se o
      # dvc.lock estiver corrompido/incoerente (a linha "deleted:
      # metropt-3+dataset.zip" que ele imprime no CI é esperada e não
      # quebra o build).
      - name: Validate DVC pipeline structure (RNF-60/61)
        run: |
          cd apps/ml
          dvc doctor
          dvc dag
          dvc status

  # 4. Mutation Testing (RNF-64) — valida que a suíte de testes do backend
  # de fato MATA mutações no código "core" (regra de negócio/inferência
  # ML/processamento de sensores/alertas/sugestão de manutenção — escopo e
  # justificativa completos em apps/backend/pyproject.toml
  # [tool.mutmut]), não só cobre linhas (isso é RNF-57/RNF-65, job acima).
  #
  # mutmut fixado em 2.5.1 (não a série 3.x): a série 3.x quebra de forma
  # reprodutível neste projeto porque seu mecanismo de "trampoline" rejeita
  # qualquer função cujo `__module__` comece com "src." (assert hardcoded
  # em mutmut/stats.py), e este projeto usa "src" como o nome real do
  # pacote top-level em todo import — ver comentário completo em
  # apps/backend/requirements-dev.txt.
  #
  # Por que matrix (18 grupos, 1 arquivo cada, RNF-68 — antes 4, depois 9)
  # em vez de um job único: mutation testing é ORDENS DE MAGNITUDE mais
  # lento que pytest — cada um dos ~1400 mutantes do escopo core dispara sua
  # PRÓPRIA subprocess de pytest; um job único rodaria os 18 arquivos
  # sequencialmente (25-90 min de parede, medido em
  # RELATORIO-RNF-64-RNF-65.md). Dividir por arquivo em grupos que rodam EM
  # PARALELO corta o tempo sem tirar nenhum arquivo do escopo real: os 18
  # grupos juntos cobrem exatamente os mesmos 18 arquivos de
  # `[tool.mutmut] paths_to_mutate` — nenhum subconjunto menor, nunca um
  # grupo "fácil" isolado escondendo um grupo maior/mais fraco (o gate
  # abaixo agrega os 18 antes de decidir).
  #
  # RNF-68 — histórico real medido no GitHub Actions (run 35638962074,
  # concurrency já em vigor, sem contaminação por outro run concorrente):
  # com 9 grupos (2 arquivos cada, exceto model_service.py sozinho) o
  # pipeline inteiro levou 1h08min — o grupo mais lento
  # (preprocessing.py + simulator.py) sozinho levou 67min, e mesmo o grupo
  # de 1 arquivo só (model_service.py) levou 38min. Causa raiz real
  # (confirmada lendo mutmut/__init__.py: sobrevivência é decidida só pelo
  # exit code do `runner`, não por parsing de texto): mutante SOBREVIVENTE
  # não tem "primeiro teste que falha" pra cortar em `-x` — reroda a suíte
  # inteira (708 testes) até o fim, e isso dominava o tempo de cada grupo,
  # não o número de arquivos por grupo.
  #
  # Duas correções tentadas, só uma sobreviveu à validação real:
  # (1) ir de 9 para 18 grupos (1 arquivo cada) — paralelismo real, cada
  # grupo roda só os mutantes do seu próprio arquivo — CONFIRMADO: run
  # 35648496340 caiu pra 50min de pipeline total.
  # (2) `-n auto` (pytest-xdist) no runner do mutmut (pyproject.toml
  # [tool.mutmut]) — media localmente ~77s serial → ~30-35s com workers, mas
  # REVERTIDO após medir no GitHub Actions real: o único par antes/depois
  # limpo (model_service.py sozinho, mesmo arquivo isolado nas duas runs)
  # foi de 38min sem `-n auto` para 50min com `-n auto` — mais lento no
  # runner real (menos núcleos que a máquina de teste local), não mais
  # rápido. Ver comentário completo em pyproject.toml [tool.mutmut].
  #
  # Resultado honesto: com o teto real de paralelismo por arquivo (18
  # grupos, o máximo que dá pra dividir sem fatiar mutantes de um mesmo
  # arquivo entre jobs), o pipeline foi de ~68min para ~50min — real, mas
  # ainda acima da meta de <15min da RNF-68. O gargalo agora é
  # model_service.py sozinho (~38-50min conforme a run), que já está no
  # menor grão possível de arquivo — ver RELATORIO-RNF-68-RNF-69.md pro
  # status final e a recomendação de próximo passo (sharding de mutantes
  # por ID dentro de um mesmo arquivo, fora do escopo desta task).
  # SEM `needs: lint-python` pelo mesmo motivo do job `test-python` acima —
  # só depende das próprias dependências.
  mutation-testing:
    name: Mutation Testing (RNF-64) — grupo ${{ matrix.group }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # RNF-68/69 — 1 arquivo por grupo (18 grupos, não 9): a 1a medição real
      # no GitHub Actions mostrou que o gargalo do pipeline é o job de
      # mutation testing mais lento (grupo com 2 arquivos combinados levou
      # 67min), não o número de grupos em si — mutante sobrevivente reroda a
      # suíte inteira (708 testes) sem o atalho do `-x`. Granularidade máxima
      # por arquivo (paralelismo real: cada grupo tem estritamente menos
      # mutantes para rodar) combinada com `-n auto` no runner do mutmut
      # (pyproject.toml [tool.mutmut]) são as duas alavancas reais aqui — sem
      # tirar nenhum arquivo do escopo nem baixar o piso de 70% (RNF-64).
      matrix:
        include:
          - group: 1
            paths: "src/services/alert_service.py"
          - group: 2
            paths: "src/services/alert_settings_service.py"
          - group: 3
            paths: "src/services/critical_failure_notification_service.py"
          - group: 4
            paths: "src/services/drift_monitor.py"
          - group: 5
            paths: "src/services/feature_buffer.py"
          - group: 6
            paths: "src/services/inference_pipeline.py"
          - group: 7
            paths: "src/services/maintenance_suggestion_service.py"
          - group: 8
            paths: "src/services/mlp_adapter.py"
          - group: 9
            paths: "src/services/model_registry.py"
          - group: 10
            paths: "src/services/model_service.py"
          - group: 11
            paths: "src/services/onnx_autoencoder_adapter.py"
          - group: 12
            paths: "src/services/onnx_sequence_adapter.py"
          - group: 13
            paths: "src/services/onnx_tree_adapter.py"
          - group: 14
            paths: "src/services/prediction_service.py"
          - group: 15
            paths: "src/services/preprocessing.py"
          - group: 16
            paths: "src/services/sensor_stream_service.py"
          - group: 17
            paths: "src/services/simulator.py"
          - group: 18
            paths: "src/services/telegram_alert_rate_limiter.py"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/backend/requirements.txt
          pip install -r apps/backend/requirements-dev.txt

      # `--paths-to-mutate` sobrescreve, só para este job, o subconjunto de
      # `[tool.mutmut] paths_to_mutate` do pyproject.toml (que continua
      # sendo a fonte de verdade do escopo CORE completo, usada também na
      # execução local via `mutmut run`) — cada grupo do matrix cobre uma
      # fatia DISJUNTA dos mesmos 18 arquivos.
      #
      # `|| true`: o exit code de `mutmut run --CI` reflete se sobrou
      # mutante vivo NESTE grupo isolado — o job não deve falhar aqui; quem
      # decide pass/fail é o `mutation-score-gate` sobre o AGREGADO dos 4
      # grupos (ver comentário acima do job `mutation-testing`).
      - name: Run mutmut (grupo ${{ matrix.group }})
        working-directory: apps/backend
        run: |
          mutmut run --paths-to-mutate="${{ matrix.paths }}" --CI 2>&1 | tee /tmp/mutmut-run.log || true

      - name: Parse mutation summary
        working-directory: apps/backend
        run: |
          python scripts/parse_mutmut_summary.py /tmp/mutmut-run.log "mutmut-summary-group-${{ matrix.group }}.json"

      - name: Upload mutation summary
        uses: actions/upload-artifact@v4
        with:
          name: mutmut-summary-group-${{ matrix.group }}
          path: apps/backend/mutmut-summary-group-${{ matrix.group }}.json

  # 5. Gate do Mutation Score (RNF-64) — agrega os 18 grupos acima e FALHA
  # o build de verdade (exit != 0) se o score combinado ficar abaixo de
  # 70%. Roda separado do job de matrix pra dar um resultado único e claro
  # no PR, em vez de 18 checks parciais que ninguém interpreta sozinho.
  mutation-score-gate:
    name: Mutation Score Gate (RNF-64, piso 70%)
    runs-on: ubuntu-latest
    needs: mutation-testing
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download all mutation summaries
        uses: actions/download-artifact@v4
        with:
          pattern: mutmut-summary-group-*
          path: /tmp/summaries
          merge-multiple: true

      - name: Check aggregated mutation score (RNF-64, >= 70%)
        run: |
          python apps/backend/scripts/check_mutation_score.py 70 /tmp/summaries/*.json

  # 6. Lint TypeScript (ESLint, Prettier)
  lint-typescript:
    name: Lint TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm" # Ativa o cache do pnpm para acelerar
          cache-dependency-path: apps/frontend/pnpm-lock.yaml

      # RNF-68 — faltava `cd apps/frontend`: não existe package.json na raiz
      # do repo, então este step falhava ANTES mesmo de instalar qualquer
      # coisa ("ERR_PNPM_NO_PKG_MANIFEST"), independente da versão do pnpm.
      - name: Install dependencies
        run: cd apps/frontend && pnpm install --frozen-lockfile

      - name: Run ESLint
        run: cd apps/frontend && pnpm eslint .

      - name: Run Prettier
        run: cd apps/frontend && pnpm prettier --check .

      # RNF-58: nenhum componente pode exceder 200 linhas. Checagem
      # COMPLEMENTAR à regra `complexity` do ESLint acima — um arquivo pode
      # ficar sob 200 linhas e ainda ser complexo demais, e vice-versa; o
      # ESLint não tem uma regra nativa de "max linhas por componente React"
      # confiável o bastante, daí o script dedicado.
      - name: Check component size (RNF-58, max 200 lines)
        run: cd apps/frontend && pnpm check:component-size

  # 7. Testes TypeScript (Vitest)
  #
  # RNF-68 — SEM `needs: lint-typescript`: mesmo raciocínio de test-python
  # acima — vitest não depende de eslint/prettier terem passado.
  test-typescript:
    name: Test TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: apps/frontend/pnpm-lock.yaml

      # RNF-68 — mesmo bug do lint-typescript: faltava `cd apps/frontend`.
      - name: Install dependencies
        run: cd apps/frontend && pnpm install --frozen-lockfile

      # RNF-59: cobertura mínima de 70% (statements/branches/functions/lines)
      # — gate real via `coverage.thresholds` em vitest.config.ts (mesmo
      # padrão do `fail_under=80` do backend em pyproject.toml). O comando
      # sai com código != 0 se qualquer métrica ficar abaixo do piso, sem
      # precisar de um step de CI separado só para checar o número.
      - name: Run Vitest com cobertura (RNF-59)
        run: |
          cd apps/frontend
          pnpm exec vitest run --coverage

      - name: Upload Vitest coverage report (RNF-69)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: apps/frontend/coverage/
          retention-days: 7

      # RNF-66/RNF-67/RNF-69 — roda de novo SÓ a suíte de acessibilidade
      # (já incluída na suíte geral acima — este step não adiciona cobertura
      # nova, só produz um relatório JSON dedicado e nomeado, fácil de achar
      # entre os artifacts do PR sem precisar abrir o log inteiro do Vitest).
      # `--reporter=default` no terminal (falha visível no job) +
      # `--reporter=json` no arquivo — os dois no mesmo comando, sem rodar a
      # suíte duas vezes.
      - name: Gerar relatório de acessibilidade (axe) — RNF-66/69
        if: always()
        run: |
          cd apps/frontend
          pnpm exec vitest run __tests__/a11y.test.tsx --reporter=default --reporter=json --outputFile=a11y-report.json

      - name: Upload accessibility report (RNF-69)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-report
          path: apps/frontend/a11y-report.json
          retention-days: 7

      # RNF-58: garante que o catálogo de componentes builda de verdade —
      # falha de build do Storybook quebra o CI, não só um "parece ok".
      - name: Build Storybook (RNF-58)
        run: |
          cd apps/frontend
          pnpm exec storybook build

      - name: Upload Storybook build (RNF-69)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storybook-build
          path: apps/frontend/storybook-static/
          retention-days: 7

  # 8. Testes E2E com Playwright + MSW (RNF-16 / RNF-17)
  #
  # RNF-68 — SEM `needs: test-typescript`: o E2E sobe seu PRÓPRIO servidor
  # (`next dev` via webServer do Playwright, ver playwright.config.ts) e usa
  # MSW para mockar a API — não depende da suíte Vitest ter passado, só do
  # build/dev server funcionar (o que este job já valida por conta própria
  # ao subir o webServer). Antes disso, test-e2e só começava depois de
  # lint-typescript → test-typescript terem passado em sequência — 2 jobs
  # inteiros de espera para um step que não precisa de nenhum dos dois.
  test-e2e:
    name: E2E Tests (Playwright + MSW)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: apps/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          cd apps/frontend
          pnpm install --frozen-lockfile

      # RNF-68 — cache do binário do Chromium (não muda a menos que a versão
      # do Playwright mude): sem isso, todo run baixa e instala o browser do
      # zero. Chave inclui a versão resolvida do playwright no lockfile —
      # invalida sozinha quando o pacote for atualizado.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('apps/frontend/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          cd apps/frontend
          pnpm exec playwright install chromium --with-deps

      # Mesmo com cache-hit, as dependências de SO do Chromium (libs apt)
      # precisam ser garantidas — `install-deps` sem baixar o browser de novo.
      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          cd apps/frontend
          pnpm exec playwright install-deps chromium

      - name: Generate MSW Service Worker
        # Cria public/mockServiceWorker.js que o MswProvider carrega no browser.
        # Deve rodar antes do build/dev server para que o arquivo esteja disponível.
        run: |
          cd apps/frontend
          pnpm e2e:setup

      - name: Run Playwright E2E tests
        run: |
          cd apps/frontend
          pnpm e2e
        env:
          CI: true
          # RNF-13: URL do backend — MSW intercepta esta origem no browser
          NEXT_PUBLIC_API_URL: http://localhost:8000
          # Ativa o MswProvider para os testes E2E
          NEXT_PUBLIC_MSW_ENABLED: "true"

      - name: Upload Playwright report
        if: always() # Faz upload mesmo em caso de falha para facilitar debugging
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/frontend/playwright-report/
          retention-days: 7

      - name: Upload test results (screenshots / traces)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: apps/frontend/e2e-results/
          retention-days: 7

  # 9. Load Smoke Test — Locust (RNF-68/69)
  #
  # Isolamento: stack Docker PRÓPRIA (db+redis+api+nginx, subida e destruída
  # só dentro deste job) — não compartilha Postgres/porta com nenhum outro
  # job. test-python usa SQLite em memória (nunca sobe Postgres real);
  # test-e2e usa MSW (nunca toca a API real); executar em paralelo com os
  # dois não pode gerar falso positivo/negativo em nenhum lado, e nenhum
  # dado gravado aqui sobrevive além do job (`docker compose down -v` no
  # final, `if: always()`).
  #
  # Reaproveita locust_streaming.py (RNF-37) — MESMO script/MESMA SLA de
  # latência (p95 < 200ms via _P95_SLA_MS, inalterada) — só com
  # concorrência bem menor via SSE_MIN_CONNECTIONS (ver comentário no
  # próprio arquivo). NÃO é o benchmark completo de 100 usuários/75s (esse
  # continua documentado no README §14.5 para execução manual/dedicada,
  # pesado demais para o orçamento de 15 min do pipeline); o objetivo aqui é
  # só detectar regressão grosseira — erro HTTP, conexão recusada, latência
  # anormal — numa carga pequena e rápida.
  load-smoke:
    name: Load Smoke Test (Locust, RNF-68/69)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Valores concretos (não os placeholders de .env.example) — POSTGRES_USER
      # e POSTGRES_DB precisam bater exatamente com o healthcheck hardcoded
      # do serviço `db` em docker-compose.yml (`pg_isready -U user -d tcc_db`).
      # Nenhum segredo real — mesma senha de exemplo usada só neste job efêmero.
      - name: Preparar .env mínimo para o smoke test
        run: |
          cat > .env << 'EOF'
          POSTGRES_USER=user
          POSTGRES_PASSWORD=smoke_test_only
          POSTGRES_DB=tcc_db
          DATABASE_URL=postgresql+asyncpg://user:smoke_test_only@db:5432/tcc_db
          ACTIVE_MODEL=random_forest_v2
          SMOTE_SAMPLING_STRATEGY=auto
          UVICORN_WORKERS=1
          DB_POOL_SIZE=10
          DB_MAX_OVERFLOW=20
          PROJECT_NAME="TCC Manutencao Preditiva"
          VERSION="1.0.0"
          ALLOWED_ORIGINS=["http://localhost"]
          DEBUG=true
          ADMIN_API_TOKEN=change-me-in-production
          OLLAMA_BASE_URL=http://host.docker.internal:11434
          OLLAMA_MODEL=llama3.2:3b
          OLLAMA_CLIENT_TIMEOUT_SECONDS=5.0
          MCP_CLIENT_TIMEOUT_SECONDS=5.0
          TELEGRAM_BOT_TOKEN=
          TELEGRAM_CHAT_ID=
          TELEGRAM_API_BASE_URL=https://api.telegram.org
          TELEGRAM_CLIENT_TIMEOUT_SECONDS=10.0
          DASHBOARD_URL=http://localhost
          CRITICAL_FAILURE_RATE_LIMIT_SECONDS=900
          DEFAULT_EQUIPMENT_ID=APU-Trem-042
          DEFAULT_EQUIPMENT_NAME="Compressor de Ar Industrial (MetroPT-3)"
          RESEND_API_KEY=
          RESEND_FROM_EMAIL="PredictIQ <alerts@predictiq.dev>"
          RESEND_API_BASE_URL=https://api.resend.com
          RESEND_CLIENT_TIMEOUT_SECONDS=10.0
          CELERY_BROKER_URL=redis://redis:6379/0
          MCP_SERVER_PORT=8100
          MCP_SERVER_URL=http://mcp-server:8100
          EOF

      # Só os 4 serviços necessários para o endpoint SSE via Nginx — nenhum
      # mcp-server/celery/frontend/minio/mlflow sobe aqui (não são exercitados
      # por este smoke test e só custariam tempo de build).
      #
      # SEM nginx: `nginx` depende de `frontend` em docker-compose.yml —
      # subi-lo forçaria um build completo do Next.js só para alcançar a API
      # por trás do proxy (achado real: esse build falhava no CI por conta
      # de ERR_PNPM_IGNORED_BUILDS do pnpm 10, sem relação nenhuma com o que
      # este smoke test mede). `docker-compose.ci-load-smoke.yml` publica a
      # porta 8000 do `api` direto no host — Locust bate na API sem Nginx.
      - name: Subir stack mínima (db + redis + api, sem Nginx/frontend)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci-load-smoke.yml \
            up -d --build db redis api

      - name: Aguardar API ficar saudável
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health >/dev/null 2>&1; then
              echo "API respondendo após $i tentativa(s)."
              exit 0
            fi
            echo "Aguardando API... ($i/30)"
            sleep 5
          done
          echo "API não respondeu a tempo — logs:"
          docker compose logs api
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # httpx: locust_streaming.py importa locust_sse.py, que usa httpx no
      # seu modo standalone (RNF-28) — dependência real do arquivo
      # reaproveitado, não usada pelo Locust em si.
      - name: Instalar Locust
        run: pip install locust==2.46.5 httpx==0.28.1

      # Concorrência de smoke (15, não 100) — ver comentário no topo do job
      # e em locust_streaming.py. SSE_HOLD_SECONDS reduzido (8s, não 45s):
      # cada usuário virtual só precisa ficar conectado tempo suficiente
      # para receber pelo menos 1 evento (cadência de 1/s) e confirmar que o
      # stream está saudável — não para validar a métrica RF-12 completa
      # (isso é responsabilidade de locust_sse.py, fora do CI). Host/porta
      # 8000 direto (sem Nginx) — SSE_PATH sem o prefixo /api que só o Nginx
      # adicionaria.
      - name: Rodar Locust smoke (SSE, concorrência reduzida)
        env:
          SSE_MIN_CONNECTIONS: "15"
          SSE_HOLD_SECONDS: "8"
          SSE_PATH: "/stream/sensors"
        run: |
          locust -f locust_streaming.py --host http://localhost:8000 \
                 --headless -u 15 -r 5 --run-time 25s \
                 --csv=loadtest-smoke --html=loadtest-smoke.html

      - name: Dump de logs da API em caso de falha
        if: failure()
        run: docker compose logs api db redis

      # RNF-69 — relatório disponível mesmo se o smoke falhar.
      - name: Upload Locust report (RNF-69)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locust-report
          path: |
            loadtest-smoke*.csv
            loadtest-smoke.html
          retention-days: 7
          if-no-files-found: warn

      - name: Encerrar stack
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci-load-smoke.yml down -v

  # 10. Quality Gate final (RNF-68/69) — consolida todos os jobs
  # obrigatórios num único check bloqueante. `needs` lista TODOS os jobs
  # que precisam ter sucesso; `if: always()` no job (não nos steps) garante
  # que ele RODA mesmo se algum `needs` falhar — sem isso, GitHub Actions
  # pularia o gate inteiro (`skipped`) em vez de reportar `failure`, o que
  # apareceria como "neutro" no PR em vez de bloquear o merge.
  # NENHUM `continue-on-error` em nenhum job acima: uma falha real em
  # qualquer um deles é uma falha real aqui.
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - env-check
      - security-audit
      - lint-python
      - test-python
      - mutation-score-gate
      - lint-typescript
      - test-typescript
      - test-e2e
      - load-smoke
    steps:
      - name: Verificar resultado de todos os jobs obrigatórios
        run: |
          echo "env-check:          ${{ needs.env-check.result }}"
          echo "security-audit:      ${{ needs.security-audit.result }}"
          echo "lint-python:         ${{ needs.lint-python.result }}"
          echo "test-python:         ${{ needs.test-python.result }}"
          echo "mutation-score-gate: ${{ needs.mutation-score-gate.result }}"
          echo "lint-typescript:     ${{ needs.lint-typescript.result }}"
          echo "test-typescript:     ${{ needs.test-typescript.result }}"
          echo "test-e2e:            ${{ needs.test-e2e.result }}"
          echo "load-smoke:          ${{ needs.load-smoke.result }}"
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || \
             [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "FALHOU: pelo menos um job obrigatório não passou."
            exit 1
          fi
          echo "Todos os jobs obrigatórios passaram."