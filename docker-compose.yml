services:
  nginx:
    image: nginx:1.25-alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - api
      - frontend
    networks:
      - app-network

  api:
    build: ./apps/backend
    container_name: api
    volumes:
      - ./apps/backend:/app
      - ./apps/ml/models:/ml/models:ro
      - ./apps/ml/data:/ml/data:ro
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - SIMULATOR_PARQUET_PATH=/ml/data/processed/metropt3.parquet
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # RNF-37 — workers configurável via UVICORN_WORKERS (.env), sem redeploy de
    # imagem. Default 1 preserva o comportamento anterior. Requer recriar o
    # container (`docker compose up -d --force-recreate api`) para aplicar,
    # mesmo padrão do ACTIVE_MODEL.
    command: sh -c "alembic upgrade head && uvicorn src.main:app --host 0.0.0.0 --port 8000 --workers ${UVICORN_WORKERS:-1}"
    deploy:
      resources:
        limits:
          memory: 3g
        reservations:
          memory: 256m
    networks:
      - app-network

  frontend:
    build: ./apps/frontend
    container_name: frontend
    volumes:
      - ./apps/frontend:/app
      - frontend_node_modules:/app/node_modules
    env_file:
      - .env
    environment:
      - NODE_OPTIONS=--max-old-space-size=3584
      - WATCHPACK_POLLING=true
    expose:
      - "3000"
    command: sh -c "CI=true pnpm install && pnpm exec next dev"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4g
    networks:
      - app-network

  ml:
    build: ./apps/ml
    container_name: ml
    volumes:
      - ./apps/ml:/app
    env_file:
      - .env
    expose:
      - "8888"
    command: jupyter notebook --ip=0.0.0.0 --allow-root --no-browser
    networks:
      - app-network

  # RF-19 / RNF-43 — servidor MCP standalone, processo e container próprios,
  # sem compartilhar nada com `api`. Alcançável na rede interna via
  # MCP_SERVER_URL=http://mcp-server:<porta> (ver .env.example). O backend
  # ainda não consome esta URL nesta task — ver README "Arquitetura MCP".
  #
  # RF-20/RNF-44 — a persistência do ChromaDB (data/chroma) e os PDFs de
  # entrada (data/manuals) NÃO ganham uma linha de volume própria aqui: eles
  # vivem dentro de apps/mcp-server/, que já é bind-mount inteiro (linha
  # abaixo) — mesmo padrão do serviço `ml` com apps/ml/data. Um segundo mount
  # para um subdiretório já coberto seria redundante.
  mcp-server:
    build: ./apps/mcp-server
    container_name: mcp-server
    volumes:
      - ./apps/mcp-server:/app
    env_file:
      - .env
    expose:
      - "${MCP_SERVER_PORT:-8100}"
    networks:
      - app-network

  # RNF-50 / RNF-51 — broker do Celery (fila assíncrona de notificações
  # críticas, ver services/critical_failure_notification_service.py +
  # tasks/notification_tasks.py). Auditado antes desta task: nenhum
  # Redis/cache existia no projeto (o rate limiter do RF-24 usa Postgres de
  # propósito — telegram_alert_rate_limiter.py). Este Redis NUNCA substitui
  # o Postgres nem guarda nenhum outro dado do domínio — é só o transporte
  # de mensagens do Celery. Sem `ports:` (só `expose`, mesmo padrão de
  # `api`/`frontend`/`mcp-server` acima) — nunca alcançável fora da rede
  # Docker interna. Sem volume: o broker é só uma fila de trabalho efêmera
  # (`task_ignore_result=True`, sem result backend) — se o Redis reiniciar,
  # o pior caso é uma notificação enfileirada e ainda não processada se
  # perder; a decisão de negócio (threshold + rate limit) já foi tomada e
  # persistida no Postgres antes do enqueue, então nada de crítico depende
  # da fila sobreviver a um restart.
  redis:
    image: redis:7-alpine
    container_name: redis
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # RNF-50 / RNF-51 — worker Celery que consome a fila acima. Mesma imagem
  # do backend (`build: ./apps/backend`, mesmo Dockerfile) e mesmo bind
  # mount de código — reaproveita 100% do código já existente (adapters,
  # rate limiter, config), não é uma segunda aplicação. NÃO sobe um
  # servidor HTTP — só o processo `celery worker`.
  celery-worker:
    build: ./apps/backend
    container_name: celery-worker
    volumes:
      - ./apps/backend:/app
      - ./apps/ml/models:/ml/models:ro
      - ./apps/ml/data:/ml/data:ro
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    command: celery -A src.core.celery_app worker --loglevel=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  db:
    image: postgres:15
    container_name: db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d tcc_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: mlflow
    env_file:
      - .env
    ports:
      - "5000:5000"
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    depends_on:
      db:
        condition: service_healthy
    command: >
      bash -c "pip install psycopg2-binary -q &&
      mlflow server
      --backend-store-uri postgresql://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@db:5432/postgres
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0 --port 5000"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mlflow_artifacts:
  frontend_node_modules:
  postgres_data:
