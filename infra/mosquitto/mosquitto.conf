# Broker MQTT da telemetria industrial (TELEMETRY_TRANSPORT=mqtt).
# Só na rede interna do compose (sem `ports:` publicado); acesso com usuário
# e senha — o arquivo de senhas é gerado no start pelo entrypoint a partir de
# MQTT_USERNAME / MQTT_PASSWORD (.env), nunca versionado.
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
persistence true
persistence_location /mosquitto/data/
log_dest stdout
